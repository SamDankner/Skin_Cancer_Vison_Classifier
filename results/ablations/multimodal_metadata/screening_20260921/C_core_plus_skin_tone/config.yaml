strategy_name: multimodal
task: diagnosis_binary
backbone: dinov2_vits14
pretrained: true
image_size: 196
batch_size: 8
epochs: 5
head_learning_rate: 0.0003
backbone_learning_rate: 1.0e-05
weight_decay: 0.0001
metadata_fields:
- age
- sex
- anatomical_site
- skin_tone
metadata_embedding_dim: 16
metadata_width: 64
fusion_width: 256
dropout: 0.2
unfreeze_last_blocks: 0
loss: weighted_cross_entropy
selection_metric: macro_f1
early_stopping_patience: 5
early_stopping_min_delta: 0.001
scheduler_patience: 2
scheduler_factor: 0.5
num_workers: 0
optimizer: adamw
metadata_dropout: 0.2
weighted_sampling: false
scheduler: reduce_on_plateau
ablation: image_plus_metadata
augmentation:
  crop_scale:
  - 0.75
  - 1.0
  rotation_degrees: 20
seed: 42
evaluate_development_test: false
models_root: results\ablations\multimodal_metadata\screening_20260921\models
summary_path: results\ablations\multimodal_metadata\screening_20260921\summary.csv
run_name: C_core_plus_skin_tone
run_directory: results\ablations\multimodal_metadata\screening_20260921\C_core_plus_skin_tone
class_names:
- benign
- malignant
metadata_preprocessor:
  fields:
  - age
  - sex
  - anatomical_site
  - skin_tone
  age_mean: 57.515625
  age_std: 19.102400783311886
  vocabularies:
    sex:
      female: 2
      male: 3
    anatomical_site:
      hand_foot: 2
      head_neck: 3
      lower_extremity: 4
      trunk: 5
      unmapped:oral/genital: 6
      upper_extremity: 7
    skin_tone:
      fitzpatrick_1: 2
      fitzpatrick_2: 3
      fitzpatrick_3: 4
      fitzpatrick_4: 5
      fitzpatrick_5: 6
  missing_value_policy:
    age: training_mean_with_missing_indicator
    categorical: dedicated_missing_id_0
    unknown_category: dedicated_unknown_id_1
  normalization: 'src.data.metadata explicit canonical mappings; nonempty unmapped
    values retain an unmapped: prefix'
checkpoint_path: results\ablations\multimodal_metadata\screening_20260921\models\multimodal\multimodal_dinov2_vits14_C_core_plus_skin_tone.pt
device: cuda
