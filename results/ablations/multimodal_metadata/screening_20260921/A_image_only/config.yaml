strategy_name: multimodal
task: diagnosis_binary
backbone: dinov2_vits14
pretrained: true
image_size: 196
batch_size: 8
epochs: 5
head_learning_rate: 0.0003
backbone_learning_rate: 1.0e-05
weight_decay: 0.0001
metadata_fields: []
metadata_embedding_dim: 16
metadata_width: 64
fusion_width: 256
dropout: 0.2
unfreeze_last_blocks: 0
loss: weighted_cross_entropy
selection_metric: macro_f1
early_stopping_patience: 5
early_stopping_min_delta: 0.001
scheduler_patience: 2
scheduler_factor: 0.5
num_workers: 0
optimizer: adamw
metadata_dropout: 0.2
weighted_sampling: false
scheduler: reduce_on_plateau
ablation: image_only
augmentation:
  crop_scale:
  - 0.75
  - 1.0
  rotation_degrees: 20
seed: 42
evaluate_development_test: false
models_root: results\ablations\multimodal_metadata\screening_20260921\models
summary_path: results\ablations\multimodal_metadata\screening_20260921\summary.csv
run_name: A_image_only
run_directory: results\ablations\multimodal_metadata\screening_20260921\A_image_only
class_names:
- benign
- malignant
metadata_preprocessor:
  fields: []
  age_mean: 0.0
  age_std: 1.0
  vocabularies: {}
  missing_value_policy:
    age: training_mean_with_missing_indicator
    categorical: dedicated_missing_id_0
    unknown_category: dedicated_unknown_id_1
  normalization: 'src.data.metadata explicit canonical mappings; nonempty unmapped
    values retain an unmapped: prefix'
checkpoint_path: results\ablations\multimodal_metadata\screening_20260921\models\multimodal\multimodal_dinov2_vits14_A_image_only.pt
device: cuda
