strategy_name: multimodal
task: diagnosis_binary
backbone: dinov2_vits14
pretrained: true
image_size: 224
batch_size: 8
num_workers: 0
epochs: 20
optimizer: adamw
head_learning_rate: 0.0003
backbone_learning_rate: 0.00001
weight_decay: 0.0001
# Skin tone remains available for controlled ablations, but is excluded here:
# availability is source-specific and can encode dataset identity.
metadata_fields: [age, sex, anatomical_site]
metadata_embedding_dim: 16
metadata_width: 64
fusion_width: 256
dropout: 0.2
metadata_dropout: 0.2
unfreeze_last_blocks: 0
loss: weighted_cross_entropy
weighted_sampling: false
selection_metric: macro_f1
early_stopping_patience: 5
early_stopping_min_delta: 0.001
scheduler: reduce_on_plateau
scheduler_patience: 2
scheduler_factor: 0.5
ablation: image_plus_metadata
augmentation:
  crop_scale: [0.75, 1.0]
  rotation_degrees: 20
