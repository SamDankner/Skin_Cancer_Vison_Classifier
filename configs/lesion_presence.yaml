strategy_name: lesion_presence
task: lesion_presence
backbone: efficientnet_v2_s
pretrained: false
image_size: 224
batch_size: 16
num_workers: 0
optimizer: adamw
learning_rate: 0.0003
fine_tuning_learning_rate: 0.00003
weight_decay: 0.00001
epochs: 1
head_epochs: 1
dropout: 0.2
loss: cross_entropy
weighted_sampling: true
# Eligible normal labels: strong, moderate, weak.  `auxiliary` ENCoDE-style
# nonlesional candidates are excluded from lesion-presence training/evaluation.
normal_label_strengths: [strong, moderate, weak]
source_balanced_sampling: false
report_source_metrics: true
selection_metric: macro_f1
early_stopping_patience: 5
early_stopping_min_delta: 0.001
scheduler: reduce_on_plateau
scheduler_patience: 2
scheduler_factor: 0.5
augmentation:
  crop_scale: [0.75, 1.0]
  rotation_degrees: 20
# Requires true normal-skin (lesion_present=0, normal_skin=true) examples.
